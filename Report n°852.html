<body>
<h1 id="h">Report n°852</h1>
<h2><a href="SRC%20report%20center.html">BACK</a></h2>

<div class="foot"> © 1903 Stolas Robotics Corporation</div>
<script>
const G="█▓▒░▌▐╪╫¤¿§Ø∆µ£%ù$*#@!?<>/\\|~^";
const Z=["\u0300","\u0301","\u0302","\u0303","\u0306","\u0308","\u030A","\u0316","\u0317","\u0323","\u0329","\u0334","\u0335","\u0336"];
const rnd=n=>Math.floor(Math.random()*n);
const corrupt=(t,p=.2,z=0)=>[...t].map(c=>{if(c===" "||Math.random()>p)return c;let g=G[rnd(G.length)];for(let i=0;i<z;i++)g+=Z[rnd(Z.length)];return g}).join("");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const TXT=["the base has had multiple blackouts because of him trying to escape", "the biggest one yet was yesterday, the whole place felt like it was shaking !", "i heard that even some naval mines exploded", "good thing we blocked off all of his capabilities with admin locks", "end report"];
const H1="Report n°852";
const HEAVY=false;
const lis=[...document.querySelectorAll("li")];
(async()=>{
  for(let i=0;i<TXT.length;i++){
    const t=TXT[i],d=lis[i];
    const s=HEAVY?corrupt(t,.15+i*.04):t;
    for(let k=0;k<s.length;k+=4){d.textContent+=s.slice(k,k+4);if(Math.random()<.3)await sleep(1)}
    await sleep(HEAVY?40:60);
  }
  start();
})();
function start(){
  if(HEAVY){
    setInterval(()=>{
      lis.forEach((d,i)=>{const t=TXT[i];
        d.textContent=Math.random()<.1?t.split("").map(c=>c===" "?c:G[rnd(G.length)]).join(""):corrupt(t,.2+i*.07,i>1?1+rnd(2):0)});
      document.getElementById("h").textContent=corrupt(H1,.45,1);
    },110);
  }else{
    setInterval(()=>{const i=rnd(lis.length),d=lis[i];if(d.dataset.f)return;d.dataset.f=1;
      d.textContent=corrupt(TXT[i],.08);setTimeout(()=>{d.textContent=TXT[i];delete d.dataset.f},90+rnd(120))},1600);
  }
}
</script>
